<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>i-am-cooking 批注编辑器</title>
<style>
  :root{--bg:#0f1117;--panel:#161a22;--line:#2b3240;--fg:#e6e9f0;--dim:#8b93a7;--accent:#7aa2f7;--warn:#e0af68;--err:#f7768e;--ok:#9ece6a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;margin:0 8px 0 0}
  button{padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:#232936;color:var(--fg);cursor:pointer;font:inherit}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#0b1020;border-color:var(--accent);font-weight:600}
  button:disabled{opacity:.45;cursor:not-allowed}
  select,input[type=date]{padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:#1b2129;color:var(--fg);font:inherit}
  label{color:var(--dim);font-size:13px}
  main{padding:14px 16px;max-width:1500px;margin:0 auto}
  #status{color:var(--dim);font-size:13px}
  #status.ok{color:var(--ok)} #status.err{color:var(--err)} #status.warn{color:var(--warn)}
  #filters{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
  .row{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px}
  .row.hidden{display:none}
  .lab{flex:0 0 300px;opacity:.92}
  .lab .n{color:var(--accent);font-weight:600;margin-right:6px}
  .grow{flex:1;min-width:200px}
  textarea{width:100%;min-height:24px;background:#12161e;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;resize:vertical}
  .meta{display:flex;gap:8px;flex:0 0 auto}
  .meta select,.meta input{width:190px}
  .hint{color:var(--dim);font-size:12px;margin-top:3px}
  .empty{padding:40px;text-align:center;color:var(--dim)}
  code{background:#1b2129;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>批注编辑器</h1>
  <button id="open">📂 打开 md</button>
  <button id="save" class="primary" disabled>💾 导出 md</button>
  <button id="dl" disabled>⬇ 下载</button>
  <button id="paste" disabled>📋 粘贴 md 文本</button>
  <span id="status">未加载文件</span>
</header>
<input type="file" id="fileInput" accept=".md,text/markdown" style="display:none">
<main>
  <div id="filters">
    <label>文件夹 <select id="fFolder"><option value="">全部</option></select></label>
    <label>日期 <select id="fDate"><option value="">全部</option></select></label>
    <button id="fClear">清除筛选</button>
    <span id="fCount"></span>
    <label><input type="checkbox" id="fOnlyEmpty"> 只看批注为空的</label>
    <label><input type="checkbox" id="fOnlyTodo"> 只看未定版</label>
  </div>
  <div id="rows"></div>
  <div class="hint">批注写进 <code>docs/HOW-IT-WORKS.zh.md</code> 的批注列，进 git。草稿自动存在浏览器里。<br>「导出 md」会下载整份文件，用它覆盖 <code>docs/HOW-IT-WORKS.zh.md</code> 即完成保存；我这边会重新渲染页面。</div>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var state={src:null,handle:null,rows:[],file:""};
  var KEY="am-annot-draft";

  function say(t,cls){ var s=$("status"); s.textContent=t; s.className=cls||""; }
  function today(){ return new Date().toISOString().slice(0,10); }

  // ── 解析 ───────────────────────────────────────────────
  function parse(src){
    var lines=src.split("\n"), h=-1;
    for(var i=0;i<lines.length;i++){ if(/^\|\s*现象\s*\|/.test(lines[i])){ h=i; break; } }
    if(h<0) return null;
    var end=h;
    while(end+1<lines.length && /^\|/.test(lines[end+1])) end++;
    var head=cells(lines[h]);
    var body=[];
    for(var j=h+2;j<=end;j++){
      var c=cells(lines[j]);
      if(!c.length) continue;
      body.push(c);
    }
    return {head:head, body:body, h:h, end:end};
  }
  function cells(line){
    return line.replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(x){
      return x.replace(/\s+/g," ").trim();
    });
  }
  function esc(t){ return t.replace(/\|/g,"\\|"); }
  function mdCell(t){ return t||"—"; }

  function rebuild(){
    var p=parse(state.src);
    if(!p) return null;
    var out=state.rows.map(function(r){
      var c=r.cells.slice();
      c[c.length-3]=esc(r.note)||"—";
      c[c.length-2]=r.folder||"待定";
      c[c.length-1]=r.date||today();
      return "| "+c.map(function(x){return x===""?"—":x;}).join(" | ")+" |";
    });
    var lines=state.src.split("\n");
    return lines.slice(0,p.h).concat([lines[p.h],lines[p.h+1]]).concat(out).concat(lines.slice(p.end+1)).join("\n");
  }

  // ── 载入 ───────────────────────────────────────────────
  function load(src,file){
    var p=parse(src);
    if(!p) return say("这份 md 里找不到「现象 / 现在怎么认定」这张表", "err");
    state.src=src; state.file=file||"(未保存)";
    var draft=null;
    try{ draft=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
    state.rows=p.body.map(function(c,i){
      var note=c[c.length-3]||"";
      if(note==="—") note="";
      if(draft&&draft[i]&&draft[i].note!==undefined) note=draft[i].note;
      var f=c[c.length-2]||"待定";
      if(f==="待定"&&draft&&draft[i]&&draft[i].folder) f=draft[i].folder;
      var d=c[c.length-1]||today();
      if(draft&&draft[i]&&draft[i].date) d=draft[i].date;
      return {cells:c,note:note,folder:f,date:d};
    });
    render();
    say("已加载 "+state.rows.length+" 行 · "+state.file,"ok");
    $("save").disabled=false; $("dl").disabled=false;
  }
  function persist(){
    try{ localStorage.setItem(KEY,JSON.stringify(state.rows.map(function(r){return {note:r.note,folder:r.folder,date:r.date};}))); }catch(e){}
  }

  // ── 渲染 ───────────────────────────────────────────────
  function render(){
    var box=$("rows"); box.innerHTML="";
    if(!state.rows.length){ box.innerHTML='<div class="empty">点「📂 打开 md」选择 docs/HOW-IT-WORKS.zh.md</div>'; return; }
    var folders={}, dates={};
    state.rows.forEach(function(r){ folders[r.folder]=1; dates[r.date]=1; });
    fillSelect($("fFolder"),Object.keys(folders).sort(),"全部文件夹");
    fillSelect($("fDate"),Object.keys(dates).sort().reverse(),"全部日期");
    state.rows.forEach(function(r,i){ box.appendChild(rowEl(r,i)); });
    applyFilter();
  }
  function fillSelect(el,items,label){
    var cur=el.value; el.innerHTML="";
    var o=document.createElement("option"); o.value=""; o.textContent=label; el.appendChild(o);
    items.forEach(function(v){ var op=document.createElement("option"); op.value=v; op.textContent=v; el.appendChild(op); });
    el.value=cur;
  }
  function rowEl(r,i){
    var div=document.createElement("div"); div.className="row"; div.dataset.i=i;
    var lab=document.createElement("div"); lab.className="lab";
    lab.innerHTML='<span class="n">'+(i+1)+'</span>'+escHtml(r.cells[0]||"");
    var grow=document.createElement("div"); grow.className="grow";
    var ta=document.createElement("textarea"); ta.value=r.note; ta.placeholder="写批注…（留空则存 —）";
    ta.addEventListener("input",function(){ r.note=ta.value; persist(); });
    grow.appendChild(ta);
    var meta=document.createElement("div"); meta.className="meta";
    var fs=document.createElement("select");
    ["待定","extensions/i-am-cooking/index.ts","extensions/i-am-cooking/lib/health.ts","extensions/i-am-cooking/lib/prefs.ts","extensions/i-am-cooking/lib/config.ts","extensions/i-am-cooking/lib/rules.ts","extensions/i-am-cooking/lib/push.ts","extensions/i-am-cooking/lib/audio.ts","extensions/i-am-cooking/lib/remote-stop.ts","extensions/i-am-cooking/lib/volume.ts","extensions/i-am-cooking/lib/tts.ts","scripts/","docs/"].forEach(function(v){
      var op=document.createElement("option"); op.value=v; op.textContent=v; fs.appendChild(op);
    });
    fs.value=r.folder; fs.title="归属文件夹";
    fs.addEventListener("change",function(){ r.folder=fs.value; persist(); applyFilter(); });
    var di=document.createElement("input"); di.type="date"; di.value=r.date; di.title="日期";
    di.addEventListener("change",function(){ r.date=di.value; persist(); applyFilter(); });
    meta.appendChild(fs); meta.appendChild(di);
    div.appendChild(lab); div.appendChild(grow); div.appendChild(meta);
    return div;
  }
  function escHtml(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

  function applyFilter(){
    if(!state.rows.length) return;
    var ff=$("fFolder").value, fd=$("fDate").value;
    var oe=$("fOnlyEmpty").checked, ot=$("fOnlyTodo").checked;
    var shown=0;
    state.rows.forEach(function(r,i){
      var el=document.querySelector('.row[data-i="'+i+'"]');
      if(!el) return;
      var ok=true;
      if(ff && r.folder!==ff) ok=false;
      if(fd && r.date!==fd) ok=false;
      if(oe && r.note.trim()) ok=false;
      if(ot && !/未定版/.test(r.cells[r.cells.length-4]||"")) ok=false;
      el.classList.toggle("hidden",!ok);
      if(ok) shown++;
    });
    $("fCount").textContent="显示 "+shown+" / "+state.rows.length+" 行";
  }

  // ── 文件 ───────────────────────────────────────────────
  $("open").addEventListener("click",function(){
    $("fileInput").value="";
    $("fileInput").click();
  });
  $("fileInput").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0];
    if(!f) return;
    f.text().then(function(t){ state.handle=null; load(t,f.name); })
      .catch(function(err){ say("读取失败："+(err&&err.message||err),"err"); });
  });

  function writeFile(handle,text){
    return handle.createWritable().then(function(w){ return w.write(text).then(function(){ return w.close(); }); });
  }
  function save(){
    var out=rebuild();
    if(out===null){ say("没有可保存的内容","err"); return; }
    persist();
    if(state.handle){
      writeFile(state.handle,out).then(function(){ say("✅ 已写回 "+state.file,"ok"); },function(){ download(out); });
    } else download(out);
  }
  function download(out){
    out=out||rebuild();
    if(out===null){ say("没有可保存的内容","err"); return; }
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([out],{type:"text/markdown;charset=utf-8"}));
    a.download="HOW-IT-WORKS.zh.md"; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
    say("已下载 HOW-IT-WORKS.zh.md，覆盖 docs/ 里那份","warn");
  }
  $("save").addEventListener("click",save);
  $("dl").addEventListener("click",function(){ download(); });
  $("paste").addEventListener("click",function(){
    var t=prompt("把 HOW-IT-WORKS.zh.md 的内容粘进来：");
    if(t) load(t,"(粘贴)");
  });
  ["fFolder","fDate","fOnlyEmpty","fOnlyTodo"].forEach(function(id){ $(id).addEventListener("change",applyFilter); });
  $("fClear").addEventListener("click",function(){
    $("fFolder").value=""; $("fDate").value=""; $("fOnlyEmpty").checked=false; $("fOnlyTodo").checked=false; applyFilter();
  });

  // 拖拽打开
  window.addEventListener("dragover",function(e){ e.preventDefault(); });
  window.addEventListener("drop",function(e){
    e.preventDefault();
    var f=e.dataTransfer.files&&e.dataTransfer.files[0];
    if(!f) return;
    f.text().then(function(t){ state.handle=null; load(t,f.name); });
  });

  $("paste").disabled=false;
  // 初始空状态
  if(!state.rows.length){
    $("rows").innerHTML='<div class="empty">点「📂 打开 md」选 <code>docs/HOW-IT-WORKS.zh.md</code>，或把文件拖进这个窗口。<br>打开后每行一个批注框，右侧选文件夹和日期，上方两个下拉按文件夹 / 日期筛选。</div>';
  }
})();
</script>
</body>
</html>
